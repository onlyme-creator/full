name: Update IPTV Playlist & EPG

on:
  schedule:
    # Quick refresh every 2 hours: playlist only (keeps token links fresh)
    - cron: "15 */2 * * *"
    # Full build once a day: playlist + EPG
    - cron: "0 6 * * *"

  # Run manually from the Actions tab
  workflow_dispatch:

# Never run two builds at once
concurrency:
  group: update-iptv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # The 06:00 UTC schedule and manual runs do a FULL build (playlist + EPG).
      # Every other scheduled run only refreshes the playlist.
      - name: Run merge.py
        run: |
          if [ "${{ github.event.schedule }}" = "15 */2 * * *" ]; then
            python merge.py --playlist-only
          else
            python merge.py
          fi

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u epg.xml
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "Auto-update playlist and EPG [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
